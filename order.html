<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Cake | Elite Cake Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <h1 class="logo">Elite Cake Studio</h1>
</header>

<section class="section">
  <h3 class="section-title">Order Your Cake</h3>

  <form class="order-form">
    <input type="text" placeholder="Your Name" required>
    <input type="tel" placeholder="Phone Number" required>
    <select>
      <option>Cake Type</option>
      <option>Birthday</option>
      <option>Wedding</option>
      <option>Custom</option>
    </select>
    <input type="text" placeholder="Cake Size">
    <input type="date">
    <textarea placeholder="Message"></textarea>
    <button type="submit" class="btn">Submit Order</button>
  </form>

  <a href="https://wa.me/0000000000" class="btn whatsapp">Order via WhatsApp</a>
</section>

<footer>
  <p>© 2026 Elite Cake Studio</p>
</footer>

</body>
</html>
